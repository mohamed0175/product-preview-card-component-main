<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>

  <main class="container">

    <!-- first flex element start -->
    <picture class="banner">
      <source media="(max-width: 700px)" srcset="images/image-product-mobile.jpg">
      <source media="(min-width: 701px)" srcset="images/image-product-desktop.jpg">
      <img src="images/image-product-mobile.jpg" alt="product-image">
    </picture>
    <!-- first flex element end -->


    <!-- second flex element start -->
    <section class="card-content box">

      <p class="perfume">PERFUME</p>

      <h1 class="title">Gabrielle Essence Eau De Parfum</h1>

      <p class="content">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="price">
        <h2>$149.99</h2>
        <h3>$169.99</h3>
      </div>

      <button><img src="images/icon-cart.svg" alt="cart-icon" style="padding-right: 5px;"> Add to Cart</button>
    
    </section>
    <!-- second flex element end -->

  </main>

</body>
</html>
